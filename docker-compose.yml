# Déploiement local de Sentinel : API + base Postgres.
# Remplace l'orchestration Kubernetes (/k8s) de l'énoncé : voir la justification dans le README.
#
# Démarrer :  docker compose up --build
# Arrêter :   docker compose down          (les données Postgres sont conservées)
#
# Les secrets (clé d'API, mot de passe) sont lus dans le fichier .env, jamais écrits ici.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data # données conservées entre deux redémarrages
    # Pas de section "ports" : la base n'est joignable QUE depuis le réseau Docker interne
    # (par l'API), jamais depuis l'extérieur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  api:
    build: .
    image: sentinel-api:local
    environment:
      API_KEY: ${API_KEY:?définir API_KEY dans .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: INFO
    ports:
      - "${API_PORT:-8000}:8000" # 8000 en développement, 8080 en production (voir cd.yml)
    depends_on:
      db:
        condition: service_healthy # l'API attend que la base soit prête
    # Redémarrage automatique après un plantage (5 tentatives au maximum). Un arrêt "normal",
    # par exemple un démarrage refusé faute de clé d'API, ne relance pas le conteneur en boucle.
    restart: on-failure:5
    read_only: true # système de fichiers en lecture seule (sécurité)
    tmpfs:
      - /tmp # seul dossier inscriptible (cache de calcul)
    cap_drop: [ALL] # aucun privilège système Linux : l'API n'en a pas besoin
    security_opt:
      - no-new-privileges:true # interdit toute élévation de privilèges dans le conteneur
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # Purge quotidienne des données de plus de 12 mois (RGPD, limitation de conservation).
  # Même image que l'API, sans port exposé ; une exécution par jour.
  purge:
    image: sentinel-api:local
    command: ["sh", "-c", "while true; do python -m api.purge; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started # l'image est construite par le service api
    # L'image hérite du contrôle de santé de l'API (appel à /health), sans objet ici :
    # la purge ne sert pas de requêtes, elle serait marquée « unhealthy » à tort.
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:

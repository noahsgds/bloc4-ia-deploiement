# Réentraînement automatique — critères 3.1, 3.2, 3.3 et 3.5 du bloc 4
#
# Déclenchement :
#   - automatiquement, par monitoring.yml quand la surveillance lève une alerte ;
#   - à la demande : onglet Actions → « Réentraînement » → Run workflow.
#
# Enchaînement :
#   1. entraîne un challenger (fenêtre glissante : anciennes données + fiches récentes) ;
#   2. le compare au champion sur des fiches jamais vues, avec les règles de promotion ;
#   3. s'il est promu : relance tous les tests avec le nouveau modèle, puis le propose
#      dans une Pull Request. Un humain relit et fusionne ; publier ensuite une version
#      (tag) déclenche la CD qui le met en production. Aucune mise en production silencieuse.
#   4. résultat ajouté au résumé de l'exécution et, le cas échéant, au ticket d'alerte.

name: Réentraînement

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Fiches récentes à utiliser (démo)"
        type: choice
        options: [patch, humanisee, normal]
        default: patch
  workflow_call:
    inputs:
      scenario:
        type: string
        required: true
      ticket:
        description: "Ticket d'alerte à compléter (facultatif)"
        type: string
        default: ""

permissions:
  contents: write # pousser la branche du nouveau modèle
  pull-requests: write # ouvrir la Pull Request
  issues: write # commenter le ticket d'alerte

jobs:
  reentrainer:
    name: Entraîner, comparer, proposer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCENARIO: ${{ inputs.scenario }}
      TICKET: ${{ inputs.ticket }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances (versions figées)
        run: pip install -r requirements.txt

      - name: Entraîner et comparer au modèle en production
        id: retrain
        run: |
          # Code de sortie : 0 = challenger promu, 3 = refusé (normal), autre = erreur.
          set +e
          python -m retrain.retrain --scenario "$SCENARIO" --summary resume.md
          code=$?
          set -e
          cat resume.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "0" ]; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "3" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Le réentraînement a échoué (code ${code}). Le modèle en production est inchangé."
            exit "$code"
          fi

      - name: Relancer tous les tests avec le nouveau modèle
        if: steps.retrain.outputs.promoted == 'true'
        run: pytest -q

      - name: Proposer le nouveau modèle en Pull Request
        id: pr
        if: steps.retrain.outputs.promoted == 'true'
        run: |
          version=$(python -c "import json; print(json.load(open('models/champion.json'))['version'])")
          branch="reentrainement/${version}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add models/
          git commit -m "Modèle ${version} : réentraînement après alerte (${SCENARIO})"
          git push origin "$branch"
          {
            cat resume.md
            echo ""
            echo "**Avant de fusionner** : relire le tableau et les règles ci-dessus."
            echo "**Après la fusion** : publier une version (tag) pour déployer ; retour arrière :"
            echo "\`python -m retrain.retrain --rollback <version précédente>\`."
          } > pr.md
          if url=$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
                --title "Modèle ${version} : réentraînement (${SCENARIO})" --body-file pr.md); then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          else
            # Le dépôt n'autorise pas GitHub Actions à créer des Pull Requests :
            # la branche est poussée, il reste à ouvrir la PR à la main.
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${branch}?expand=1"
            echo "url=${compare}" >> "$GITHUB_OUTPUT"
            echo "::warning::Pull Request non créée automatiquement : ouvrir ${compare}"
          fi

      - name: Conserver le rapport de réentraînement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-reentrainement-${{ inputs.scenario }}
          path: retrain/reports/
          if-no-files-found: ignore
          retention-days: 90

      - name: Compléter le ticket d'alerte
        if: always() && inputs.ticket != ''
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ -f resume.md ]; then cat resume.md; else echo "Réentraînement en échec."; fi
            echo ""
            if [ -n "$PR_URL" ]; then echo "Nouveau modèle proposé : ${PR_URL}"; fi
            echo "Exécution : ${RUN_URL}"
          } > commentaire.md
          gh issue comment "$TICKET" --body-file commentaire.md

# Livraison continue (CD) — critères 4.1 à 4.6
#
# Déclenchement : publication d'une version, c'est-à-dire un tag Git du type v1.2.0.
#   git tag v1.2.0 && git push origin v1.2.0
#
# Enchaînement automatique :
#   1. CI complète (tests, ruff, image + test de démarrage), via ci.yml ;
#   2. construction et publication de l'image sur le registre GitHub (ghcr.io),
#      pour Mac Apple Silicon (arm64) et serveurs classiques (amd64) ;
#   3. création d'une "Release" GitHub avec les notes de version du CHANGELOG.
# Mise en production ensuite (une commande, voir README) : l'image déployée est
# exactement celle qui a été testée.

name: CD

on:
  push:
    tags: ["v*.*.*"]

# Par défaut, aucun droit : chaque job ne reçoit que ce dont il a besoin (moindre privilège).
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sentinel-api

jobs:
  ci:
    name: Intégration continue
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publier:
    name: Publier l'image et la version
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # créer la Release
      packages: write # publier l'image sur ghcr.io
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer la construction multi-architecture
        uses: docker/setup-qemu-action@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # jeton temporaire fourni par GitHub, jamais écrit dans le code

      - name: Calculer les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Créer la Release GitHub avec les notes du CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Extrait la section "## [x.y.z]" du CHANGELOG correspondant à la version.
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" {keep=1; next}
            /^## \[/ {keep=0}
            keep' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Image : \`${IMAGE}:${VERSION#v}\`" >> notes.md
          gh release create "$VERSION" --title "Sentinel $VERSION" --notes-file notes.md
